name: main.yml
on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io/webaps

jobs:
  what-to-build:
    name: Determine what to build
    runs-on: ubuntu-latest
    outputs:
      frankenphp-changed: ${{ steps.set-outputs.outputs.frankenphp-changed }}
      mysql-changed: ${{ steps.set-outputs.outputs.mysql-changed }}
    steps:
    - name: Check out code from GitHub
      uses: actions/checkout@v4.2.2
      with:
        fetch-depth: 0
    - name: Detect Directory Changes
      id: detect
      uses: tj-actions/changed-files@v47.0.1
      with:
        files_yaml: |
          frankenphp:
            - 'frankenphp/**'
          mysql:
            - 'mysql/**'
    - name: Set outputs
      id: set-outputs
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "frankenphp-changed=true" >> $GITHUB_OUTPUT
          echo "mysql-changed=true" >> $GITHUB_OUTPUT
          exit 0
        fi
        
        if [[ "${{ steps.detect.outputs.frankenphp_any_changed }}" == "true" ]]; then
            echo "frankenphp-changed=true" >> $GITHUB_OUTPUT
        else
            echo "frankenphp-changed=false" >> $GITHUB_OUTPUT
        fi
        
        if [[ "${{ steps.detect.outputs.mysql_any_changed }}" == "true" ]]; then
            echo "mysql-changed=true" >> $GITHUB_OUTPUT
        else
            echo "mysql-changed=false" >> $GITHUB_OUTPUT
        fi

  build-frankenphp:
    name: Build and push PHP image
    runs-on: ubuntu-latest
    needs: what-to-build
    if: needs.what-to-build.outputs.frankenphp-changed == 'true'
    strategy:
      matrix:
        php-version:
          - "8.3"
          - "8.4"
          - "8.5"
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v4.2.2
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push PHP image
        uses: docker/build-push-action@v6
        with:
          context: ./frankenphp
          file: ./frankenphp/Dockerfile
          push: true
          platforms: |
            linux/amd64
            linux/arm64
          build-args: |
            PHP_VERSION=${{ matrix.php-version }}
          cache-from: type=gha,scope=frankenphp-${{ matrix.php-version }}-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=frankenphp-${{ matrix.php-version }}-${{ github.ref_name }}
          tags: |
            ${{ env.REGISTRY }}/frankenphp:${{ matrix.php-version }}

  build-mysql:
    name: Build and push MySQL image
    runs-on: ubuntu-latest
    needs: what-to-build
    if: needs.what-to-build.outputs.mysql-changed == 'true'
    strategy:
      matrix:
        mysql-version:
          - "8.0"
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v4.2.2
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push MySQL image
        uses: docker/build-push-action@v6
        with:
          context: ./mysql
          file: ./mysql/Dockerfile
          push: true
          platforms: |
            linux/amd64
            linux/arm64
          build-args: |
            MYSQL_VERSION=${{ matrix.mysql-version }}
          cache-from: type=gha,scope=mysql-${{ matrix.mysql-version }}-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=mysql-${{ matrix.mysql-version }}-${{ github.ref_name }}
          tags: |
            ${{ env.REGISTRY }}/mysql:${{ matrix.mysql-version }}